<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Discovery</title><link rel="stylesheet" href="style.css"></head><body><aside><strong>PRODUCT / INTELLIGENCE</strong><nav><a href="#discovery">상품 발굴</a><a href="#records">개발 기록</a><a href="https://github.com/darrenpual/product">GitHub ↗</a></nav><small>TAOBAO · TMALL<br>Research workspace</small></aside><main><section id="discovery"><div class="eyebrow">DAILY DISCOVERY / V0.3</div><h1>새로운 제품의 발견.</h1><p>디자인과 가격 경쟁력을 중심으로 선별하는 상품 레퍼런스.</p><div class="metrics"><article><small>공개 레퍼런스</small><b id="total">—</b></article><article><small>수집 카테고리</small><b>13</b></article><article><small>디자인 / 가격</small><b>40 / 30%</b></article></div><div class="toolbar"><input id="search" placeholder="상품명 검색" aria-label="상품명 검색"><select id="category" aria-label="카테고리"><option>전체</option><option>뷰티 디바이스</option><option>퍼스널 케어</option><option>두피·모발 관리</option><option>구강 관리</option><option>기능성 생활용품</option><option>운동 보조기구</option><option>건강관리 용품</option><option>반려동물용품</option><option>수면 관리 용품</option><option>소형 전자기기</option><option>스마트 하드웨어</option><option>화장품</option><option>가정용 소형 가전</option></select><select id="sort" aria-label="정렬"><option value="overall">종합 점수순</option><option value="design">디자인 점수순</option><option value="price">낮은 가격순</option></select></div><div id="status" role="status">데이터 불러오는 중</div><div id="gallery" class="gallery"></div><button id="saved" type="button">저장 상품 보기</button></section><section id="records"><div class="eyebrow">ENGINEERING LOG</div><h2>개발 기록</h2><div class="records"><article><h3>시스템 아키텍처</h3><img src="development-records/architecture.svg" alt="수집, 분석, 구글시트, API 및 UI 흐름"></article><article><h3>일일 자동화</h3><img src="development-records/daily.svg" alt="일일 수집 및 배포 단계"></article></div><a href="https://github.com/darrenpual/product/tree/main/development-records">개발 문서 전체 보기 ↗</a></section></main><script src="app.js" defer
